          <p>AI Context Brain dynamically maps project frameworks, structures project memory, filters files recursively with .brainignore, and synchronizes custom architectural constraints directly with Cursor, Windsurf, VS Code, Claude Code, and Aider in real-time.</p>
          <h2>What it does</h2>
          <p>Scan your repository locally, generate optimized project memory, and export IDE-specific context rules (cursorrules, windsurfrules, claude.md, CLAUDE.md) without uploading your raw source code.</p>
          <h2>Key features</h2>
          <ul>
            <li>Real-time Architecture Guard — enforce naming, folder, and dependency rules as you code</li>
