name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            vscode-extension/package-lock.json
            web-dashboard/package-lock.json

      - name: Backend build
        run: dotnet build backend/AiContextBrain.csproj

      - name: Architecture guard source scan
        run: node scripts/ci-architecture-guard.mjs

      - name: Smoke tests
        run: node --test tests/smoke.test.mjs

      - name: Extension install
        working-directory: vscode-extension
        run: npm ci

      - name: Extension compile
        working-directory: vscode-extension
        run: npm run compile

      - name: Dashboard install
        working-directory: web-dashboard
        run: npm ci

      - name: Dashboard build
        working-directory: web-dashboard
        run: npm run build
