<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#0f1419"/>
  
  <!-- Brain outline -->
  <ellipse cx="64" cy="60" rx="38" ry="34" fill="none" stroke="#0078d4" stroke-width="3"/>
  
  <!-- Brain left hemisphere curve -->
  <path d="M64 26 C64 26 42 30 36 48 C30 66 40 82 64 94" fill="none" stroke="#0078d4" stroke-width="3"/>
  
  <!-- Brain right hemisphere curve -->
  <path d="M64 26 C64 26 86 30 92 48 C98 66 88 82 64 94" fill="none" stroke="#0078d4" stroke-width="3"/>
  
  <!-- Center divider -->
  <line x1="64" y1="26" x2="64" y2="94" stroke="#0078d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <!-- Neural nodes -->
  <circle cx="46" cy="46" r="4" fill="#00bcf2"/>
  <circle cx="82" cy="46" r="4" fill="#00bcf2"/>
  <circle cx="40" cy="64" r="4" fill="#0078d4"/>
  <circle cx="88" cy="64" r="4" fill="#0078d4"/>
  <circle cx="50" cy="78" r="4" fill="#00bcf2"/>
  <circle cx="78" cy="78" r="4" fill="#00bcf2"/>
  <circle cx="64" cy="52" r="5" fill="#ffffff"/>
  
  <!-- Neural connections -->
  <line x1="46" y1="46" x2="64" y2="52" stroke="#00bcf2" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="46" x2="64" y2="52" stroke="#00bcf2" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="64" x2="64" y2="52" stroke="#0078d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="88" y1="64" x2="64" y2="52" stroke="#0078d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="78" x2="40" y2="64" stroke="#00bcf2" stroke-width="1.5" opacity="0.7"/>
  <line x1="78" y1="78" x2="88" y2="64" stroke="#00bcf2" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="78" x2="64" y2="52" stroke="#00bcf2" stroke-width="1" opacity="0.4"/>
  <line x1="78" y1="78" x2="64" y2="52" stroke="#00bcf2" stroke-width="1" opacity="0.4"/>
  
  <!-- AI text -->
  <text x="64" y="118" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0078d4" text-anchor="middle" letter-spacing="2">BRAIN</text>
